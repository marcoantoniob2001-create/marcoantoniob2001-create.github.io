<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marco Personal — Victoria</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e1a;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:700px;margin:auto;padding:14px 14px 90px}.hero,.card{background:#121b2f;border:1px solid #293753;border-radius:20px;padding:16px}.brand{font-size:11px;letter-spacing:.12em;color:#aa94ff;font-weight:900}h1{margin:5px 0;font-size:26px}.muted{color:#9eabc0;font-size:12px}.weeks,.days{display:flex;gap:7px;overflow:auto;margin:11px 0}.weeks button,.days button{border:1px solid #2b3956;background:#141e34;color:#aeb9cb;padding:9px 12px;border-radius:12px;white-space:nowrap}.weeks button.on{background:#785bdf;color:#fff}.days button{border-radius:999px;font-weight:800}.days button.on{background:#fff;color:#101625}.bar{height:8px;background:#26324a;border-radius:9px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#8a6bef}.stats{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:#aab5c7}.title{margin:16px 2px 8px}.title h2{margin:0;font-size:21px}.card{margin:9px 0;border-radius:16px;padding:13px}.top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900}.info{font-size:12px;color:#9ca9bd;margin-top:3px}.cue{font-size:12px;line-height:1.35;color:#c7d0df;background:#0e1728;border:1px solid #263652;border-radius:10px;padding:8px 10px;margin-top:9px}.video{text-decoration:none;background:#211b3d;border:1px solid #5945a1;padding:7px 9px;border-radius:9px;font-size:12px;color:#fff}.set{display:grid;grid-template-columns:32px 1fr 52px 52px 48px;gap:6px;align-items:center;background:#0c1425;border-radius:10px;padding:6px;margin-top:6px}.check{width:29px;height:29px;border-radius:50%;border:1px solid #53617b;background:#141e34;color:#aeb8c9}.check.done{background:#22c55e;border-color:#22c55e;color:white}.set span{font-size:11px;color:#b5c0d1}.set input{width:100%;background:#162139;border:1px solid #2c3a56;color:white;border-radius:7px;padding:6px 2px;text-align:center;font-size:11px}.rest{display:flex;align-items:center;gap:7px;border-top:1px solid #25314a;margin-top:9px;padding-top:8px;font-size:11px;color:#9ba8bd}.rest b{margin-left:auto;color:white}.rest button,.finish{border:1px solid #35435f;background:#18233b;color:white;border-radius:8px;padding:6px 8px}.finish{width:100%;background:#1d6540;border-color:#2d8154;padding:12px;margin-top:10px;font-weight:900}.timer{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#162039;border:1px solid #3b4966;padding:11px 15px;border-radius:15px;z-index:9}.timer b{font-size:21px}.feedback{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end}.feedback.on{display:flex}.sheet{width:min(700px,100%);margin:auto;background:#121b2f;padding:18px;border-radius:22px 22px 0 0}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.moods button{background:#17233b;border:1px solid #30405e;color:white;border-radius:10px;padding:8px 2px}.moods button.on{background:#785bdf}textarea{width:100%;height:90px;margin-top:10px;background:#0c1425;border:1px solid #30405e;border-radius:10px;color:white;padding:10px}.send{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:#22c55e;font-weight:900}.close{width:100%;margin-top:8px;padding:10px;border:1px solid #35435f;border-radius:10px;background:#18233b;color:white}.weeknote{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#0e1728;color:#c7d0df;font-size:12px;line-height:1.4}.alert{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#2a1d10;border:1px solid #62431d;color:#f0d4aa;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<header class="hero">
<div class="brand">MARCO PERSONAL</div>
<h1>Protocolo Victoria</h1>
<div class="muted">4 semanas • 5 treinos • foco em definição, redução de gordura e glúteos</div>
<div class="weeknote" id="weeknote"></div>
<div class="alert">Atenção: em exercícios de joelho, respeite amplitude confortável. Se houver aumento importante de dor, interrompa e avise.</div>
<div class="bar"><i id="bar"></i></div>
<div class="stats"><span id="wk">Semana 1 • Base</span><b id="stat">0%</b></div>
</header>
<div class="weeks" id="weeks"></div>
<div class="days" id="days"></div>
<main id="main"></main>
</div>

<div class="timer" id="timer"><b id="clock">01:00</b> <button onclick="stopTimer()">Parar</button></div>

<div class="feedback" id="feedback">
  <div class="sheet">
    <h3>Treino concluído</h3>
    <div class="muted">Como você se sentiu?</div>
    <div class="moods">
      <button onclick="mood(this,'Muito bem')">Muito bem</button>
      <button onclick="mood(this,'Bem')">Bem</button>
      <button onclick="mood(this,'Normal')">Normal</button>
      <button onclick="mood(this,'Cansada')">Cansada</button>
      <button onclick="mood(this,'Muito cansada')">Muito cansada</button>
    </div>
    <textarea id="note" placeholder="Feedback, dor, dificuldade, carga leve/pesada..."></textarea>
    <button class="send" onclick="send()">Enviar para Marco no WhatsApp</button>
    <button class="close" onclick="feedback.classList.remove('on')">Fechar</button>
  </div>
</div>

<script>
const data=[
["Segunda","Glúteos + Posteriores A",[
["Elevação pélvica na máquina",3,"8–10","RIR 1–2",90,"Ajuste o apoio para ficar confortável sobre o quadril. Suba contraindo os glúteos e evite hiperestender a lombar."],
["Stiff com halteres",3,"8–10","RIR 2",90,"Leve o quadril para trás, mantenha a coluna neutra e desça somente até onde conseguir manter controle e tensão nos posteriores."],
["Cadeira flexora",3,"10–12","RIR 1–2",75,"Mantenha quadril e tronco apoiados. Flexione os joelhos com controle e evite soltar a carga na volta."],
["Afundo reverso com halteres",3,"10–12 por perna","RIR 2",90,"Dê um passo para trás, mantenha o pé da frente firme no chão e desça dentro de uma amplitude confortável para o joelho."],
["Cadeira abdutora",3,"12–15","RIR 1–2",60,"Mantenha o tronco estável e abra as pernas sem impulso. Controle a volta da carga."]
]],
["Terça","Superiores A + Core",[
["Puxada alta na frente",3,"8–10","RIR 1–2",90,"Mantenha o peito aberto e puxe a barra em direção à parte alta do peito, conduzindo pelos cotovelos."],
["Remada baixa na máquina",3,"10–12","RIR 1–2",90,"Mantenha o tronco estável e puxe em direção ao abdômen, sem balançar o corpo."],
["Supino na máquina",3,"8–10","RIR 2",90,"Ajuste o banco para manter ombros confortáveis. Empurre com controle e não retire as costas do apoio."],
["Elevação lateral com halteres",3,"12–15","RIR 1–2",60,"Eleve os braços com controle até aproximadamente a linha dos ombros, sem usar balanço do tronco."],
["Rosca bíceps na polia",3,"10–12","RIR 1–2",60,"Mantenha cotovelos próximos ao corpo e evite jogar o tronco para trás durante a subida."],
["Tríceps na polia com corda",3,"10–12","RIR 1–2",60,"Mantenha os cotovelos fixos próximos ao corpo e finalize a extensão sem inclinar o tronco."],
["Prancha abdominal",3,"30–45 s","Controle",45,"Mantenha abdômen ativo, glúteos contraídos e evite deixar a lombar afundar."]
]],
["Quarta","Quadríceps + Glúteos",[
["Agachamento no Smith",3,"8–10","RIR 2",90,"Mantenha os pés firmes e desça com controle até a amplitude que o joelho tolerar sem piora importante da dor."],
["Leg Press 45°",3,"10–12","RIR 2",90,"Mantenha quadril e lombar apoiados. Desça com controle e use amplitude confortável para o joelho."],
["Cadeira extensora",3,"12–15","RIR 2",75,"Execute de forma controlada e sem impulso. Se houver desconforto no joelho, reduza carga ou amplitude e avise o Marco."],
["Coice para glúteo na máquina/polia",3,"10–12","RIR 1–2",75,"Mantenha o tronco firme e estenda o quadril sem girar a pelve ou exagerar na lombar."],
["Panturrilha no Leg Press",3,"12–15","RIR 1–2",60,"Faça amplitude completa, alongando embaixo e realizando uma breve contração no topo."]
]],
["Quinta","Superiores B + Core + Cardio",[
["Remada articulada na máquina",3,"8–10","RIR 1–2",90,"Mantenha o peito apoiado quando possível e puxe conduzindo pelos cotovelos, sem elevar os ombros."],
["Puxada alta pegada neutra",3,"10–12","RIR 1–2",90,"Mantenha o tronco estável e conduza o movimento pelos cotovelos, evitando puxar apenas com os braços."],
["Desenvolvimento de ombros na máquina",3,"8–10","RIR 2",90,"Mantenha as costas apoiadas e empurre a carga acima da cabeça sem exagerar na extensão da lombar."],
["Crucifixo na máquina",3,"10–12","RIR 1–2",75,"Mantenha os ombros apoiados e feche os braços com controle, evitando soltar a carga na volta."],
["Elevação lateral na polia",3,"12–15","RIR 1–2",60,"Mantenha o tronco firme e eleve o braço lateralmente sem usar impulso."],
["Abdominal no solo",3,"15–20","Controle",45,"Aproxime as costelas da pelve, mantenha o movimento curto e controlado e evite puxar o pescoço."],
["Cardio leve/moderado",1,"15 min","Confortável",0,"Faça em intensidade leve a moderada. Se a esteira incomodar o joelho, use bicicleta ou elíptico e avise o Marco."]
]],
["Sexta","Glúteos + Posteriores B",[
["Agachamento sumô no Smith",3,"8–10","RIR 2",90,"Use base mais aberta, pés firmes e desça com controle. Respeite uma amplitude confortável para o joelho."],
["Mesa flexora",3,"10–12","RIR 1–2",75,"Mantenha o quadril apoiado e controle tanto a subida quanto a descida da carga."],
["Elevação pélvica na máquina",3,"10–12","RIR 1–2",90,"Suba contraindo os glúteos e mantenha o abdômen firme. Evite hiperestender a lombar no topo."],
["Agachamento búlgaro no Smith — ênfase em glúteos",3,"10–12 por perna","RIR 2",90,"Deixe o pé da frente um pouco mais afastado e incline levemente o tronco à frente. Desça somente até uma amplitude confortável para o joelho."],
["Cadeira abdutora",3,"15–20","RIR 1–2",60,"Abra as pernas com controle, sem impulso, e retorne devagar mantendo tensão nos glúteos."]
]]
];

const weekNames=['Base','Progressão','Pico','Deload'];
const weekNotes=[
'Semana 1: adaptação ao protocolo. Priorize técnica, amplitude confortável e mantenha cerca de 2 repetições em reserva na maior parte das séries.',
'Semana 2: progressão gradual. Tente acrescentar repetições mantendo a técnica e o RIR indicado; aumente a carga quando completar o topo da faixa com controle.',
'Semana 3: pico controlado. Busque o topo da faixa de repetições e progrida carga quando conseguir cumprir todas as séries com boa execução.',
'Semana 4: deload. Reduza a carga ou o esforço, mantenha execução limpa e priorize recuperação antes do próximo bloco.'
];

let week=+(localStorage.getItem('victoria_week')||1),day=0,feel='',ti;

function key(s){return 'victoria_'+week+'_'+day+'_'+s}
function setWeek(w){week=w;localStorage.setItem('victoria_week',String(w));render()}
function setDay(i){day=i;render()}

function drawNav(){
 document.getElementById('weeks').innerHTML=[1,2,3,4].map(w=>`<button class="${w==week?'on':''}" onclick="setWeek(${w})"><b>Semana ${w}</b><br><small>${weekNames[w-1]}</small></button>`).join('');
 document.getElementById('days').innerHTML=data.map((d,i)=>`<button class="${i==day?'on':''}" onclick="setDay(${i})">${d[0].slice(0,3).toUpperCase()}</button>`).join('');
}

function render(){
 drawNav();
 document.getElementById('wk').textContent=`Semana ${week} • ${weekNames[week-1]}`;
 document.getElementById('weeknote').textContent=weekNotes[week-1];
 const d=data[day];

 const cards=d[2].map((e,ei)=>{
   let rows='';
   const nsets=e[1];
   for(let s=1;s<=nsets;s++){
     let id=ei+'_'+s,done=localStorage.getItem(key('d_'+id))==='1';
     rows+=`<div class="set">
       <button class="check ${done?'done':''}" onclick="toggle(this,'${id}')">${done?'✓':'○'}</button>
       <span>Série ${s}</span>
       <input placeholder="kg" value="${localStorage.getItem(key('kg_'+id))||''}" onchange="localStorage.setItem(key('kg_${id}'),this.value)">
       <input placeholder="reps" value="${localStorage.getItem(key('rp_'+id))||''}" onchange="localStorage.setItem(key('rp_${id}'),this.value)">
       <span>${e[3]}</span>
     </div>`;
   }
   const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+' execução');
   return `<section class="card">
      <div class="top"><div><div class="name">${e[0]}</div><div class="info">${e[1]} série(s) • ${e[2]} • ${e[3]}</div></div>
      <a class="video" href="${yt}" target="_blank">Vídeo</a></div>
      <div class="cue">${e[5]}</div>
      ${rows}
      <div class="rest"><span>Descanso</span><b>${e[4]?e[4]+'s':'—'}</b>${e[4]?`<button onclick="startTimer(${e[4]})">Iniciar</button>`:''}</div>
   </section>`;
 }).join('');

 document.getElementById('main').innerHTML=`<div class="title"><div class="muted">${d[0]}</div><h2>${d[1]}</h2></div>${cards}<button class="finish" onclick="finish()">Finalizar treino</button>`;
 progress();
}

function toggle(btn,id){
 const k=key('d_'+id);
 const done=localStorage.getItem(k)==='1';
 localStorage.setItem(k,done?'0':'1');
 btn.classList.toggle('done',!done);
 btn.textContent=!done?'✓':'○';
 progress();
 if(!done){
   const card=btn.closest('.card');
   const restBtn=card.querySelector('.rest button');
   if(restBtn) restBtn.click();
 }
}

function progress(){
 const d=data[day];
 let all=0,done=0;
 d[2].forEach((e,ei)=>{
   for(let s=1;s<=e[1];s++){
     all++;
     if(localStorage.getItem(key('d_'+ei+'_'+s))==='1')done++;
   }
 });
 const p=all?Math.round(done/all*100):0;
 document.getElementById('bar').style.width=p+'%';
 document.getElementById('stat').textContent=p+'%';
}

function startTimer(sec){
 clearInterval(ti);
 let left=sec;
 const box=document.getElementById('timer'),clock=document.getElementById('clock');
 box.style.display='block';
 const draw=()=>clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
 draw();
 ti=setInterval(()=>{left--;draw();if(left<=0){clearInterval(ti);box.style.display='none';}},1000);
}

function stopTimer(){clearInterval(ti);document.getElementById('timer').style.display='none'}

function finish(){document.getElementById('feedback').classList.add('on')}

function mood(el,val){
 feel=val;
 document.querySelectorAll('.moods button').forEach(b=>b.classList.remove('on'));
 el.classList.add('on');
}

function send(){
 const d=data[day];
 let all=0,done=0;
 d[2].forEach((e,ei)=>{
   for(let s=1;s<=e[1];s++){
     all++;
     if(localStorage.getItem(key('d_'+ei+'_'+s))==='1')done++;
   }
 });
 const msg=`Treino concluído — Protocolo Victoria

${data[day][0]}
Semana ${week}/4
Séries: ${done}/${all}
Percepção: ${feel||'Não informado'}
Feedback: ${document.getElementById('note').value||'Sem observações'}`;
 window.open('https://wa.me/5533999291921?text='+encodeURIComponent(msg),'_blank');
}

render();
</script>
</body>
</html>

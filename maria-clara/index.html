<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marco Personal — Maria Clara</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e1a;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:700px;margin:auto;padding:14px 14px 90px}.hero,.card{background:#121b2f;border:1px solid #293753;border-radius:20px;padding:16px}.brand{font-size:11px;letter-spacing:.12em;color:#aa94ff;font-weight:900}h1{margin:5px 0;font-size:26px}.muted{color:#9eabc0;font-size:12px}.weeks,.days{display:flex;gap:7px;overflow:auto;margin:11px 0}.weeks button,.days button{border:1px solid #2b3956;background:#141e34;color:#aeb9cb;padding:9px 12px;border-radius:12px;white-space:nowrap}.weeks button.on{background:#785bdf;color:#fff}.days button{border-radius:999px;font-weight:800}.days button.on{background:#fff;color:#101625}.bar{height:8px;background:#26324a;border-radius:9px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#8a6bef}.stats{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:#aab5c7}.title{margin:16px 2px 8px}.title h2{margin:0;font-size:21px}.card{margin:9px 0;border-radius:16px;padding:13px}.top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900}.info{font-size:12px;color:#9ca9bd;margin-top:3px}.cue{font-size:12px;line-height:1.35;color:#c7d0df;background:#0e1728;border:1px solid #263652;border-radius:10px;padding:8px 10px;margin-top:9px}.warning{font-size:12px;line-height:1.4;color:#f2d7aa;background:#2b2112;border:1px solid #5c4522;border-radius:12px;padding:10px;margin:10px 0}.video{text-decoration:none;background:#211b3d;border:1px solid #5945a1;padding:7px 9px;border-radius:9px;font-size:12px;color:#fff}.set{display:grid;grid-template-columns:32px 1fr 52px 52px 48px;gap:6px;align-items:center;background:#0c1425;border-radius:10px;padding:6px;margin-top:6px}.check{width:29px;height:29px;border-radius:50%;border:1px solid #53617b;background:#141e34;color:#aeb8c9}.check.done{background:#22c55e;border-color:#22c55e;color:white}.set span{font-size:11px;color:#b5c0d1}.set input{width:100%;background:#162139;border:1px solid #2c3a56;color:white;border-radius:7px;padding:6px 2px;text-align:center;font-size:11px}.rest{display:flex;align-items:center;gap:7px;border-top:1px solid #25314a;margin-top:9px;padding-top:8px;font-size:11px;color:#9ba8bd}.rest b{margin-left:auto;color:white}.rest button,.finish{border:1px solid #35435f;background:#18233b;color:white;border-radius:8px;padding:6px 8px}.finish{width:100%;background:#1d6540;border-color:#2d8154;padding:12px;margin-top:10px;font-weight:900}.timer{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#162039;border:1px solid #3b4966;padding:11px 15px;border-radius:15px;z-index:9}.timer b{font-size:21px}.feedback{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end}.feedback.on{display:flex}.sheet{width:min(700px,100%);margin:auto;background:#121b2f;padding:18px;border-radius:22px 22px 0 0}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.moods button{background:#17233b;border:1px solid #30405e;color:white;border-radius:10px;padding:8px 2px}.moods button.on{background:#785bdf}textarea{width:100%;height:90px;margin-top:10px;background:#0c1425;border:1px solid #30405e;border-radius:10px;color:white;padding:10px}.send{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:#22c55e;font-weight:900}.close{width:100%;margin-top:8px;padding:10px;border:1px solid #35435f;border-radius:10px;background:#18233b;color:white}.weeknote{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#0e1728;color:#c7d0df;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<header class="hero">
<div class="brand">MARCO PERSONAL</div>
<h1>Protocolo Maria Clara</h1>
<div class="muted">4 semanas • 5 treinos • 60–70 min</div>
<div class="weeknote" id="weeknote"></div>
<div class="bar"><i id="bar"></i></div>
<div class="stats"><span id="wk">Semana 1 • Base</span><b id="stat">0%</b></div>
</header>
<div class="weeks" id="weeks"></div>
<div class="days" id="days"></div>
<main id="main"></main>
</div>
<div class="timer" id="timer"><b id="clock">01:00</b> <button onclick="stopTimer()">Parar</button></div>
<div class="feedback" id="feedback"><div class="sheet"><h3>Treino concluído</h3><div class="muted">Como você se sentiu?</div><div class="moods"><button onclick="mood(this,'Muito bem')">Muito bem</button><button onclick="mood(this,'Bem')">Bem</button><button onclick="mood(this,'Normal')">Normal</button><button onclick="mood(this,'Cansada')">Cansada</button><button onclick="mood(this,'Muito cansada')">Muito cansada</button></div><textarea id="note" placeholder="Feedback, dor, dificuldade, carga leve/pesada..."></textarea><button class="send" onclick="send()">Enviar para Marco no WhatsApp</button><button class="close" onclick="feedback.classList.remove('on')">Fechar</button></div></div>
<script>
const data=[
["Segunda","Quadríceps + Glúteos + Core",[
["Cadeira extensora",3,"12–15","RIR 2–3",60,"Controle a subida e a descida. Evite impulsionar o tronco para completar as repetições."],
["Leg Press 45°",3,"10–12","RIR 3",90,"Mantenha quadril e pelve apoiados. Use amplitude confortável e evite deixar a lombar arredondar no final da descida."],
["Agachamento no Smith para banco",3,"10–12","RIR 3",90,"Desça com controle até uma amplitude confortável. Mantenha o tronco firme e evite perder a posição da pelve."],
["Afundo estático com apoio",3,"10 por perna","RIR 2–3",75,"Use apoio para estabilidade. Mantenha o tronco controlado e distribua a carga sem compensar com a lombar."],
["Cadeira abdutora",3,"15–20","RIR 2",45,"Mantenha a pelve estável e evite balanço do tronco."],
["Hip Thrust",3,"10–12","RIR 2–3",90,"Suba até estender o quadril sem hiperestender a lombar. Mantenha abdômen ativo e queixo levemente recolhido."],
["Dead Bug",3,"6–10 por lado","Técnica",45,"Mantenha a lombar estável e mova braços/pernas sem perder o controle do tronco."]]],
["Terça","Costas + Bíceps + Cardio",[
["Puxada frontal na polia",3,"10–12","RIR 2–3",75,"Mantenha peito aberto e tronco estável. Puxe sem jogar o corpo para trás."],
["Remada máquina com apoio no peito",3,"10–12","RIR 2–3",75,"Mantenha o peito apoiado e conduza o movimento com os cotovelos, sem tirar o tronco do suporte."],
["Remada baixa na polia",3,"10–12","RIR 2–3",75,"Mantenha o tronco estável durante todo o movimento. Evite inclinar o corpo para trás para completar a repetição."],
["Pulldown braços estendidos",2,"12–15","RIR 2",60,"Mantenha costelas e pelve controladas. Evite aumentar a curvatura lombar durante a puxada."],
["Rosca direta na polia",3,"10–12","RIR 2",60,"Mantenha cotovelos próximos ao corpo e evite balanço do tronco."],
["Rosca martelo",2,"12–15","RIR 2",60,"Mantenha ombros estáveis e não use impulso."],
["Cardio moderado",1,"15–20 min","Confortável",0,"Use esteira ou bicicleta em intensidade moderada, sem piora de sintomas."]]],
["Quarta","Posterior + Glúteos + Core",[
["Mesa flexora",3,"10–12","RIR 2–3",60,"Mantenha quadril apoiado e evite compensar elevando a pelve."],
["Cadeira flexora",3,"12–15","RIR 2–3",60,"Mantenha o tronco apoiado e faça o movimento com controle."],
["Hip Thrust",3,"8–12","RIR 2–3",90,"Finalize com extensão do quadril, não com hiperextensão da lombar."],
["Step-up baixo",3,"10 por perna","RIR 2–3",75,"Suba com controle e controle principalmente a descida. Evite inclinar excessivamente o tronco."],
["Glúteo na polia",3,"12–15 por perna","RIR 2",60,"Mantenha o tronco estável e evite compensar aumentando a curvatura lombar."],
["Cadeira abdutora",3,"15–20","RIR 2",45,"Controle a abertura e o retorno sem balanço do tronco."],
["Bird Dog",3,"8 por lado","Técnica",45,"Mantenha pelve e tronco estáveis. Estenda braço e perna sem girar o quadril."],
["Prancha lateral joelhos apoiados",3,"20–30 s por lado","Técnica",45,"Mantenha corpo alinhado e evite deixar o quadril cair."]]],
["Quinta","Peito + Ombros + Tríceps + Cardio",[
["Supino máquina",3,"10–12","RIR 2–3",75,"Mantenha as costas apoiadas e os pés firmes. Evite arquear excessivamente a lombar."],
["Supino inclinado máquina/halteres",3,"10–12","RIR 2–3",75,"Mantenha escápulas apoiadas e controle a descida."],
["Crucifixo máquina",2,"12–15","RIR 2",60,"Mantenha ombros controlados e não force amplitude desconfortável."],
["Elevação lateral",3,"12–15","RIR 2",45,"Evite impulso do tronco. Eleve os braços com controle."],
["Desenvolvimento máquina com encosto",2,"10–12","RIR 2–3",75,"Mantenha coluna apoiada no encosto e evite compensar com hiperextensão lombar."],
["Tríceps corda",3,"10–12","RIR 2",60,"Mantenha cotovelos estáveis e tronco firme."],
["Tríceps unilateral na polia",2,"12–15","RIR 2",45,"Mantenha ombro e tronco estáveis durante todo o movimento."],
["Cardio moderado",1,"15 min","Confortável",0,"Prefira intensidade moderada e ritmo contínuo."]]],
["Sexta","Lower Body + Metabólico",[
["Leg Press 45°",3,"12","RIR 2–3",90,"Mantenha pelve apoiada e use amplitude confortável sem arredondar a lombar."],
["Cadeira extensora",3,"12–15","RIR 2",60,"Controle a execução e evite impulso."],
["Mesa ou cadeira flexora",3,"12–15","RIR 2",60,"Mantenha quadril e tronco estáveis durante as repetições."],
["Elevação pélvica",3,"12","RIR 2–3",75,"Eleve o quadril sem hiperestender a lombar. Faça uma pausa curta no topo."],
["Cadeira abdutora",3,"15–20","RIR 2",45,"Mantenha pelve estável e evite balanço do tronco."],
["Cardio final",1,"15–20 min","Moderado",0,"Bike, elíptico ou caminhada em intensidade moderada e confortável."]]]
];
const weekNames=['Base','Progressão','Pico','Deload'];
const weekNotes=[
'Semana 1: adaptação e observação. Priorize técnica, controle e RIR 3 na maior parte das séries.',
'Semana 2: progressão gradual. Se a execução estiver boa e sem piora dos sintomas, aproxime-se de RIR 2–3.',
'Semana 3: pico controlado. Progrida carga ou repetições sem perder técnica e sem buscar falha nos multiarticulares.',
'Semana 4: deload. Reduza a carga ou esforço e mantenha execução limpa, favorecendo recuperação.'
];
let week=+(localStorage.getItem('pmc_week')||1),day=0,feel='',ti;
function key(s){return 'pmc_'+week+'_'+day+'_'+s}
function setWeek(w){week=w;localStorage.setItem('pmc_week',String(w));render()}
function setDay(i){day=i;render()}
function drawNav(){
 document.getElementById('weeks').innerHTML=[1,2,3,4].map(w=>`<button class="${w==week?'on':''}" onclick="setWeek(${w})"><b>Semana ${w}</b><br><small>${weekNames[w-1]}</small></button>`).join('');
 document.getElementById('days').innerHTML=data.map((d,i)=>`<button class="${i==day?'on':''}" onclick="setDay(${i})">${d[0].slice(0,3).toUpperCase()}</button>`).join('');
}
function render(){
 drawNav();document.getElementById('wk').textContent=`Semana ${week} • ${weekNames[week-1]}`;document.getElementById('weeknote').textContent=weekNotes[week-1];
 const d=data[day];
 const cards=d[2].map((e,ei)=>{
   let rows='';
   for(let s=1;s<=e[1];s++){
     let id=ei+'_'+s,done=localStorage.getItem(key('d_'+id))==='1';
     rows+=`<div class="set"><button class="check ${done?'done':''}" onclick="toggle(this,'${id}')">${done?'✓':'○'}</button><span>Série ${s}</span><input placeholder="kg" value="${localStorage.getItem(key('kg_'+id))||''}" onchange="localStorage.setItem(key('kg_${id}'),this.value)"><input placeholder="reps" value="${localStorage.getItem(key('rp_'+id))||''}" onchange="localStorage.setItem(key('rp_${id}'),this.value)"><input placeholder="RIR" value="${localStorage.getItem(key('ri_'+id))||''}" onchange="localStorage.setItem(key('ri_${id}'),this.value)"></div>`;
   }
   const rest=e[4]>0?`<div class="rest"><span>Descanso</span><b>${Math.floor(e[4]/60)}:${String(e[4]%60).padStart(2,'0')}</b><button onclick="timerStart(${e[4]})">Iniciar</button></div>`:'';
   return `<div class="card"><div class="top"><div><div class="name">${e[0]}</div><div class="info">${e[1]} × ${e[2]} • ${e[3]}</div></div><a class="video" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+' exercício execução')}">Vídeo</a></div><div class="cue">${e[5]}</div>${rows}${rest}</div>`;
 }).join('');
 document.getElementById('main').innerHTML=`<div class="title"><h2>${d[0]}</h2><div class="muted">${d[1]}</div></div><div class="warning"><b>Atenção L4–L5:</b> treino inicial conservador. Interromper o exercício se houver aumento de dor, dor irradiada, formigamento, dormência ou perda de força e comunicar ao profissional.</div>${cards}<button class="finish" onclick="feedback.classList.add('on')">Finalizar treino</button>`;
 progress();
}
function toggle(b,id){let v=!b.classList.contains('done');b.classList.toggle('done',v);b.textContent=v?'✓':'○';localStorage.setItem(key('d_'+id),v?'1':'0');progress()}
function progress(){const m=document.getElementById('main');let a=m.querySelectorAll('.check').length,d=m.querySelectorAll('.check.done').length,p=a?Math.round(d/a*100):0;document.getElementById('stat').textContent=d+'/'+a+' séries • '+p+'%';document.getElementById('bar').style.width=p+'%'}
function timerStart(s){clearInterval(ti);let r=s;timer.style.display='block';tick(r);ti=setInterval(()=>{r--;tick(r);if(r<=0){clearInterval(ti);navigator.vibrate?.([150,80,150])}},1000)}
function tick(r){clock.textContent=String(Math.max(0,Math.floor(r/60))).padStart(2,'0')+':'+String(Math.max(0,r%60)).padStart(2,'0')}
function stopTimer(){clearInterval(ti);timer.style.display='none'}
function mood(b,v){feel=v;document.querySelectorAll('.moods button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function send(){const m=document.getElementById('main');let a=m.querySelectorAll('.check').length,d=m.querySelectorAll('.check.done').length;let msg=`Treino concluido - Marco Personal - Maria Clara\n\nDia: ${data[day][0]}\nSemana: ${week}/4\nSeries concluidas: ${d}/${a}\nPercepcao: ${feel||'Nao informado'}\nFeedback: ${document.getElementById('note').value||'Sem observacoes'}`;window.open('https://wa.me/5533999291921?text='+encodeURIComponent(msg),'_blank')}
render();
</script>
</body>
</html>
